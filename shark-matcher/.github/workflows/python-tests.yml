name: Matcher Tests

on: [push]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 CPU tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install Linux CPU PyTorch
        if: runner.os == 'Linux'
        run: >-
          python -m pip install
          torch==2.6.0 torchvision==0.21.0
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.txt
      - name: Run the deterministic suite
        run: python -m tests.tools.run_tests
      - name: Run error-level Python lint
        run: python -m tests.tools.run_tests --py-style
      - name: Report external and hardware coverage
        if: always()
        shell: bash
        run: |
          {
            echo '### Coverage intentionally outside this job'
            echo '- `tests/manual`: stochastic and manually invoked checks.'
            echo '- SQLite parity: requires an explicit external `PARITY_DB_PATH`.'
            echo '- CUDA and MPS: best-effort platforms, not V1 release gates.'
          } >> "$GITHUB_STEP_SUMMARY"

  package-smoke:
    name: Installed package smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install Linux CPU PyTorch
        if: runner.os == 'Linux'
        run: >-
          python -m pip install
          torch==2.6.0 torchvision==0.21.0
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install the matcher package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Import the installed matcher outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c
          "import src; import src.core.constants; import src.core.path_utils;
          import src.core.utils; import src.config.config;
          import src.retrieval.suggestions"
