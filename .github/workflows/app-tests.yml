name: Application Tests

on: [push]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 CPU tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: shark-matcher-app

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: shark-matcher-app/requirements/requirements*.txt
      - name: Install SQLite command-line tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.txt
      - name: Run the deterministic suite
        run: python -m tests.tools.run_tests
      - name: Run error-level Python lint
        run: python -m tests.tools.run_tests --py-style
      - name: Report external and manual coverage
        if: always()
        shell: bash
        run: |
          {
            echo '### Coverage intentionally outside this job'
            echo '- `tests/manual`: manual and live-workspace checks.'
            echo '- `sm-data`: optional sample/reference data for walkthroughs and manual validation; CI uses the immutable committed fixture.'
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: Browser workflows (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shark-matcher-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: shark-matcher-app/requirements/requirements*.txt
      - name: Install test dependencies and browsers
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3
          python -m pip install -r requirements/requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run browser workflows
        run: python -m tests.tools.run_tests --browser
      - name: Preserve failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: shark-matcher-app/test-results/

  package-smoke:
    name: Installed package smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: shark-matcher-app

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: shark-matcher-app/requirements/requirements*.txt
      - name: Install the application package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Import the installed application outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c
          "from core import app_constants, app_utils"

  javascript-lint:
    name: JavaScript lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shark-matcher-app

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: shark-matcher-app/requirements/requirements.txt
      - name: Install the application package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shark-matcher-app/frontend/package-lock.json
      - name: Install locked JavaScript dependencies
        working-directory: shark-matcher-app/frontend
        run: npm ci --ignore-scripts
      - name: Run repository-owned JavaScript lint
        run: python -m tests.tools.run_tests --js-style
